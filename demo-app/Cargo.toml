[package]
name = "actix-web-demo"
version = "0.1.0"
edition = "2021"

[workspace]

[dependencies]
# Web framework
actix-web = "4"
actix-files = "0.6"

# Async runtime
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
